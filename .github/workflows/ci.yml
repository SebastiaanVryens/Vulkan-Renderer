name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
          cache: true

      - name: Configure
        run: cmake -S . -B build

      # Builds the game (which also compiles the shaders, so a GLSL error fails the run) and the tests
      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run the unit tests
        run: ctest --test-dir build --build-config Debug --output-on-failure
